<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Srikanth Cars</title>
  <style>
    body {
      margin: 0;
      font-family: 'times new roman', serif;
      background-color: #eee7dd;
      color: #4A2C2A;
    }
    header {
      background-color: #d21e2d;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 28px;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #bc2323;
      padding: 10px 0;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #980505;
      padding: 10px 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .hero {
      text-align: center;
      padding: 50px 10%;
    }
    .hero h1 {
      font-size: 48px;
      color: #e04949;
    }
    .hero p {
      font-size: 20px;
      line-height: 1.6;
    }
    .btn {
      background-color: #ca0e0e;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 25px;
      font-size: 18px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 50px 10%;
    }
    .gallery-item {
      text-align: center;
    }
    .gallery img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
    }
    .gallery p {
      margin-top: 10px;
      font-size: 18px;
    }
    footer {
        text-align: center;
      padding: 20px 0;
      background: #d23d3d;
      color: white;
    }
  </style>
</head>
<body>

  <header>Srikanth Cars</header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About Us</a>
    <a href="#list">Our vehicles</a>
    <a href="#contact">Contact</a>
  </nav>

  <section class="hero">
    <h1>Welcome to SRIKANTH CARS</h1>
    <p>We are here with the business specializing in pre-owned premium cars </p>
    <a class="btn" href="#list">Explore Our vehicles</a>
  </section>

  <section class="gallery">
    <div class="gallery-item">
        <img src="porshe..jpg">
        <p> PORSHE CAYENNE</p>
      </div>
      <div class="gallery-item">
        <img src="rangerover.jpg">
        <p>RANGE ROVER SPORT</p>
      </div>
      <div class="gallery-item">
        <img src="thar.jpg">
        <p>MAHINDRA THAR</p>
      </div>
    </section>
  
    <footer>
      © 2025 SRIKANTH CARS. All rights reserved.
    </footer>
