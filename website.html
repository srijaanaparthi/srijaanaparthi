<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App with Timer</title>
    <link rel="stylesheet" href="stylecode.css">
</head>
<style></style>
</style>
<script src="jscode.js">
const questions = [
    {
        question: "What is the capital of France?",
        answers: ["Berlin", "Madrid", "Paris", "Lisbon"],
        correct: 2
    },
    {
        question: "Which programming language is used for web development?",
        answers: ["Python", "C++", "JavaScript", "Java"],
        correct: 2
    },
    {
        question: "What does HTML stand for?",
        answers: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "Hyper Text Markdown Language", "Hyperlink and Text Markup Language"],
        correct: 1
    }
];

let currentQuestionIndex = 0;
let score = 0;
let timeLeft = 30;
let timer;

const questionElement = document.getElementById("question");
const answersContainer = document.getElementById("answers");
const nextButton = document.getElementById("next-btn");
const timerElement = document.getElementById("time");
function startQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    timeLeft = 30;
    nextButton.style.display = "none";
    showQuestion();
    startTimer();
}

function startTimer() {
    timeLeft = 30;
    timerElement.textContent = timeLeft;
    clearInterval(timer); 
    timer = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft === 0) {
            clearInterval(timer);
            nextQuestion();
        }
    }, 1000);
}

function showQuestion() {
    resetState();
    let currentQuestion = questions[currentQuestionIndex];
    questionElement.textContent = currentQuestion.question;

    currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.textContent = answer;
        button.classList.add("btn");
        button.addEventListener("click", () => selectAnswer(index, currentQuestion.correct));
        answersContainer.appendChild(button);
    });
}

function resetState() {
    nextButton.style.display = "none";
    answersContainer.innerHTML = "";
}

function selectAnswer(selectedIndex, correctIndex) {
    if (selectedIndex === correctIndex) {
        score++;
    }
    clearInterval(timer);
    nextButton.style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        startTimer();
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    questionElement.textContent = Quiz completed! score: ${score}/${questions.length};
    answersContainer.innerHTML = "";
    nextButton.textContent = "Restart Quiz";
    nextButton.style.display = "block";
    nextButton.onclick = startQuiz;
}

nextButton.addEventListener("click", nextQuestion);

startQuiz();
</script>

<body>
    <div class="quiz-container">
        <h1>Quiz App</h1>
        <div id="timer">Time Left: <span id="time">30</span> sec</div>
        <div id="question-container">
            <p id="question">Loading question...</p>
            <div id="answers"></div>
        </div>
        <button id="next-btn">Next</button>
    </div>

    </script>
</body>
</html>
